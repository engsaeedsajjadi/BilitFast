{% extends "base.html" %}
{% block title %}Bilit Fast — مسیرها{% endblock %}

{% block content %}
<section class="card toolbar">
  <button class="btn btn-primary" id="btn-add-route">➕ افزودن مسیر جدید</button>
  <button class="btn btn-danger" id="btn-close-all">✖ بستن همه مسیرها</button>
  <span id="trial-badge" class="badge"></span>
</section>

<section class="card">
  <h2>مسیرهای جستجو</h2>
  <table class="table" id="routes-table">
    <thead>
      <tr>
        <th>route_id</th>
        <th>مبدا</th>
        <th>مقصد</th>
        <th>تاریخ</th>
        <th>شماره قطار</th>
        <th>ظرفیت جستجو</th>
        <th>وضعیت</th>
        <th>عملیات</th>
      </tr>
    </thead>
    <tbody>
      <tr class="empty-row"><td colspan="8">هیچ مسیری تعریف نشده است.</td></tr>
    </tbody>
  </table>
</section>
{% endblock %}

{% block scripts %}
<script>
const API = {
  routes: () => fetch('/api/routes').then(r => r.json()),
  add: () => fetch('/api/routes', {method: 'POST'}).then(r => r.json()),
  closeAll: () => {
    return fetch('/api/routes').then(r => r.json()).then(routes =>
      Promise.all(routes.map(rt => fetch(`/api/routes/${rt.id}/stop`, {method: 'POST'})))
    );
  },
  del: id => fetch(`/api/routes/${id}`, {method: 'DELETE'}),
  trial: () => fetch('/api/trial').then(r => r.json()),
};

const STATUS_COLORS = {
  'gray': '#999', 'black': '#333', 'red': '#c0392b', 'orange': '#e67e22',
  'green': '#27ae60', 'blue': '#2980b9'
};

function renderRoutes(routes) {
  const tbody = document.querySelector('#routes-table tbody');
  if (!routes.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">هیچ مسیری تعریف نشده است.</td></tr>';
    return;
  }
  tbody.innerHTML = routes.map(r => `
    <tr class="route-row" data-id="${r.id}">
      <td>${r.id}</td>
      <td>${r.from || '-'}</td>
      <td>${r.to || '-'}</td>
      <td>${r.date || '-'}</td>
      <td>${r.train_number || '-'}</td>
      <td>${r.capacity || '-'}</td>
      <td><span class="status-dot" style="color:${STATUS_COLORS[r.status_color] || '#333'}">●</span> ${r.status || ''}</td>
      <td>
        <button class="btn btn-sm" onclick="openRoute(${r.id})">باز کردن</button>
        <button class="btn btn-sm btn-danger" onclick="deleteRoute(${r.id})">حذف</button>
      </td>
    </tr>
  `).join('');
}

function openRoute(id) {
  window.open(`/route/${id}`, '_blank');
}

async function deleteRoute(id) {
  if (!confirm(`مسیر ${id} حذف شود؟`)) return;
  await API.del(id);
  refresh();
}

async function refresh() {
  const [routes, trial] = await Promise.all([API.routes(), API.trial()]);
  renderRoutes(routes);
  const badge = document.getElementById('trial-badge');
  badge.textContent = trial.message;
  badge.className = 'badge badge-' + trial.state;
}

document.getElementById('btn-add-route').addEventListener('click', async () => {
  const res = await API.add();
  if (res.error) { alert(res.error); return; }
  openRoute(res.route_id);
  refresh();
});

document.getElementById('btn-close-all').addEventListener('click', async () => {
  await API.closeAll();
  refresh();
});

refresh();
setInterval(refresh, 3000);
</script>
{% endblock %}
