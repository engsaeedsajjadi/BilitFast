<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bilit Fast{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">🚆</span>
        <span class="brand-name">Bilit Fast</span>
        <span class="brand-sub">سامانه خرید بلیط قطار</span>
      </div>
      <nav class="topnav">
        <a href="{{ url_for('index') }}">مسیرها</a>
        <a href="{{ url_for('login_page') }}">ورود</a>
        <a href="{{ url_for('settings_page') }}">تنظیمات</a>
        <a href="{{ url_for('trial_page') }}">وضعیت مجوز</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Bilit Fast — نسخه تحت وب
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
