# Render Blueprint — برای استقرار یک‌کلیکه روی Render.com
services:
  - type: web
    name: bilitfast
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir web --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
