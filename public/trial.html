<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وضعیت مجوز — Bilit Fast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">🚆</span>
        <span class="brand-name">Bilit Fast</span>
      </div>
      <nav class="topnav">
        <a href="index.html">مسیرها</a>
        <a href="login.html">ورود</a>
        <a href="settings.html">تنظیمات</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="card narrow">
      <h2>وضعیت مجوز</h2>
      <div id="content"></div>
    </section>
  </main>
  <footer class="footer">Bilit Fast — نسخه تحت وب (serverless)</footer>

  <script src="app.js"></script>
  <script>
  function render() {
    const ts = BilitFast.trialState();
    const c = document.getElementById('content');
    if (ts.state === 'activated') {
      c.innerHTML = '<div class="alert alert-success">✅ برنامه به صورت دائمی فعال شده است.</div>' +
        '<a class="btn btn-primary" href="index.html">ورود به برنامه</a>';
    } else if (ts.state === 'expired') {
      c.innerHTML = '<p>دوره آزمایشی شما به پایان رسیده است. برای فعال‌سازی دائمی، کد فعال‌سازی را وارد کنید:</p>' +
        '<form id="activate-form">' +
        '<div class="field"><label>کد فعال‌سازی:</label><input type="text" id="code" required></div>' +
        '<button class="btn btn-primary" type="submit">فعال‌سازی</button>' +
        '</form>' +
        '<div id="alert" style="display:none"></div>';
      document.getElementById('activate-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const code = document.getElementById('code').value;
        const el = document.getElementById('alert');
        if (BilitFast.activate(code)) {
          el.style.display = 'block';
          el.className = 'alert alert-success';
          el.textContent = '✅ برنامه به صورت دائمی فعال شد.';
          setTimeout(() => render(), 600);
        } else {
          el.style.display = 'block';
          el.className = 'alert alert-error';
          el.textContent = '❌ کد فعال‌سازی نادرست است.';
        }
      });
    } else if (ts.state === 'not_started') {
      c.innerHTML = '<p>آیا مایل به شروع دوره آزمایشی ۲ روزه هستید؟</p>' +
        '<button class="btn btn-primary" id="start-trial">شروع دوره آزمایشی</button>';
      document.getElementById('start-trial').addEventListener('click', () => {
        BilitFast.startTrial();
        render();
      });
    } else {
      c.innerHTML = '<div class="alert alert-success">دوره آزمایشی فعال است.</div>' +
        '<a class="btn btn-primary" href="index.html">ورود به برنامه</a>';
    }
  }
  render();
  </script>
</body>
</html>
