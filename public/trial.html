<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وضعیت مجوز — Bilit Fast</title>
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1f47">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="BilitFast — صفحه اصلی">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><defs><linearGradient id="bfg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2459e8"/><stop offset="1" stop-color="#0b1f47"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#bfg)"/><path d="M13 10.5h14a4 4 0 0 1 4 4V25a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4V14.5a4 4 0 0 1 4-4z" fill="#fff"/><rect x="12" y="14" width="16" height="6.5" rx="2" fill="#2459e8"/><circle cx="14.5" cy="24.6" r="1.7" fill="#ff8a3d"/><circle cx="25.5" cy="24.6" r="1.7" fill="#ff8a3d"/><path d="M14 29l-3 3.5M26 29l3 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="brand-text"><span class="brand-name">Bilit<span class="brand-fast">Fast</span></span><span class="brand-sub">رزرو هوشمند بلیت قطار</span></span>
      </a>
      <nav class="topnav" aria-label="منوی اصلی">
        <a href="index.html">مسیرها</a>
        <a href="history.html">تاریخچه رزروها</a>
        <a href="login.html">اتصال سفیر ریل</a>
        <a href="settings.html">تنظیمات</a>
        <a href="account.html">حساب کاربری</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="card narrow">
      <h2>وضعیت مجوز</h2>
      <div id="status-content"><p class="muted">در حال بررسی...</p></div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <span>BilitFast — رزرو هوشمند بلیت قطار</span>
      <nav class="footer-links" aria-label="پیوندهای پایین صفحه">
        <a href="privacy.html">حریم خصوصی</a>
        <a href="trial.html">وضعیت مجوز</a>
        <a href="extension-help.html">راهنمای افزونه</a>
      </nav>
    </div>
  </footer>

  <script src="secure-store.js"></script>
  <script src="app.js"></script>
  <script>
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>\"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  }
  function showAlert(id, msg, ok) {
    const el = document.getElementById(id);
    el.style.display = 'block';
    el.className = 'alert ' + (ok ? 'alert-success' : 'alert-error');
    el.textContent = msg;
  }

  function activationForm() {
    return '<form id="activate-form">' +
      '<div class="field"><label for="code">کد فعال‌سازی دائمی:</label>' +
      '<textarea id="code" rows="3" required autocomplete="off" placeholder="BF1...."></textarea></div>' +
      '<button class="btn btn-primary btn-lg" type="submit">فعال‌سازی دائمی</button>' +
      '</form><div id="alert" style="display:none"></div>';
  }

  async function renderStatus() {
    const c = document.getElementById('status-content');
    c.innerHTML = '<p class="muted">در حال بررسی وضعیت مجوز...</p>';
    const ts = await BilitFast.fetchLicenseState(true);

    let html = '';
    if (ts.state === 'activated') {
      html = '<div class="alert alert-success">✅ ' + esc(ts.message || 'برنامه به‌صورت دائمی فعال است') + '</div>' +
        '<a class="btn btn-primary btn-lg" href="index.html">ورود به برنامه</a>';
    } else if (ts.state === 'active') {
      const hours = Math.max(0, Math.ceil((Number(ts.remainingMs) || 0) / 3600000));
      const remaining = Number.isFinite(ts.remainingMs)
        ? '<p>زمان باقی‌مانده: <strong>' + hours.toLocaleString('fa-IR') + ' ساعت</strong></p>'
        : '';
      html = '<div class="alert alert-success">دوره آزمایشی ۳ روزه فعال است.</div>' + remaining +
        (ts.deviceId ? '<p class="muted">شناسه نصب برای دریافت کد: <code id="device-id"></code></p>' : '') +
        '<a class="btn btn-primary btn-lg" href="index.html">ورود به برنامه</a>' +
        '<p style="margin-top:18px">مدیر مجموعه هستید و کد دائمی استقرار را از فروشنده دریافت کرده‌اید؟ آن را همین‌جا وارد کنید:</p>' +
        activationForm();
    } else if (ts.state === 'expired') {
      html = '<div class="alert alert-error">دوره آزمایشی ۷۲ ساعته به پایان رسیده است.</div>' +
        (ts.deviceId ? '<p class="muted">شناسه نصب برای دریافت کد: <code id="device-id"></code></p>' : '') +
        '<p>برای فعال‌سازی استقرار، با حساب <strong>مدیر مجموعه</strong> وارد شوید و کد امضاشده فروشنده را وارد کنید:</p>' + activationForm();
    } else if (ts.state === 'login_required') {
      html = '<div class="alert alert-error">برای فعال‌سازی ابتدا وارد حساب سازمانی شوید.</div>' +
        '<a class="btn btn-primary btn-lg" href="account.html">ورود به حساب</a>';
    } else if (ts.state === 'not_started') {
      html = '<p>دوره آزمایشی ۳ روزه (۷۲ ساعت) را آغاز کنید:</p>' +
        '<button class="btn btn-primary btn-lg" id="start-trial">شروع دوره آزمایشی</button>' +
        '<p style="margin-top:18px">یا اگر کد فعال‌سازی دارید، آن را وارد کنید تا برنامه به‌صورت دائمی فعال شود:</p>' +
        '<form id="activate-form">' +
        '<div class="field"><label for="code">کد فعال‌سازی:</label><input type="text" id="code" required autocomplete="off" placeholder="BF-..."></div>' +
        '<button class="btn btn-primary btn-lg" type="submit">فعال‌سازی دائمی</button>' +
        '</form><div id="alert" style="display:none"></div>';
    } else {
      html = '<div class="alert alert-error">⚠️ ' + esc(ts.message || 'خطا در ارتباط با سرور') + '</div>' +
        '<button class="btn btn-primary" id="retry-btn">تلاش مجدد</button>';
    }
    c.innerHTML = html;
    const deviceEl = document.getElementById('device-id');
    if (deviceEl) deviceEl.textContent = ts.deviceId || '';

    const retryBtn = document.getElementById('retry-btn');
    if (retryBtn) retryBtn.addEventListener('click', renderStatus);

    const startBtn = document.getElementById('start-trial');
    if (startBtn) startBtn.addEventListener('click', async (e) => {
      e.target.disabled = true;
      const st = await BilitFast.startTrial();
      if (st.state === 'active' || st.state === 'activated') { renderStatus(); return; }
      showAlert('alert', '❌ ' + (st.message || 'خطا در شروع دوره آزمایشی'), false);
      e.target.disabled = false;
    });

    const actForm = document.getElementById('activate-form');
    if (actForm) actForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = await BilitFast.activate(document.getElementById('code').value);
      showAlert('alert', result.ok ? '✅ برنامه فعال شد.' : '❌ ' + result.message, result.ok);
      if (result.ok) setTimeout(renderStatus, 600);
    });
  }

  renderStatus();
  </script>
</body>
</html>
