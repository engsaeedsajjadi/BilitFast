<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Tahoma, sans-serif; width: 280px; padding: 14px; margin: 0; background: #f8fafc; }
    h3 { margin: 0 0 6px; font-size: 14px; color: #0f172a; }
    p { font-size: 11px; color: #64748b; line-height: 1.8; margin: 0 0 10px; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px; font-size: 20px;
      text-align: center; letter-spacing: 6px; direction: ltr;
      border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px;
    }
    button {
      width: 100%; padding: 10px; font-size: 13px; font-family: inherit;
      background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: default; }
    #msg { font-size: 11px; margin-top: 10px; line-height: 1.8; }
    .ok { color: #166534; } .err { color: #991b1b; }
  </style>
</head>
<body>
  <h3>🚆 انتقال کوکی صفیر ریل</h3>
  <p>
    در برنامه بیلیت فست، دکمه «دریافت کوکی از افزونه» را بزنید و
    کد ۶ رقمی نمایش‌داده‌شده را اینجا وارد کنید.
  </p>
  <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="------">
  <button id="send">ارسال کوکی‌ها</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
